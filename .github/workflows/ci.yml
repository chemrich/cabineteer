name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref (e.g. rapid force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Python paths — what the tests and evals are written against.
  # No CadQuery/opcut/rectpack, so this stays fast. Runs on all three OSes:
  # the core (MCP server, parametric, cutlist BOM, evals) must work on the
  # platforms people actually run it — Windows (Claude Desktop) and macOS
  # (dev). Catches path-separator, filename-validation, and encoding bugs.
  lite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows lite is INFORMATIONAL until the UTF-8 file-I/O fix lands (the
    # product writes/reads cutlist + project files without encoding="utf-8",
    # which crashes under Windows' cp1252 default — surfaced by this very
    # job). Promote to required once green. ubuntu + macOS are required.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false          # let every OS/py combo report, don't cancel siblings
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        # Uniform shell across OSes (Windows runners ship Git Bash) so the
        # one-liners below don't need per-platform quoting.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (lite)
        run: uv sync --no-group full
      - name: Assert lite is lite
        # If a dep change ever pulls any full-group package into the lite
        # env, this job would silently test the full paths — fail loudly
        # instead (cadquery, opcut, rectpack, reportlab all guarded).
        run: uv run --no-group full python -c "import importlib.util, sys; missing = [m for m in ('cadquery', 'opcut', 'rectpack', 'reportlab') if importlib.util.find_spec(m) is not None]; sys.exit(1 if missing else 0)"
      - name: Tests
        run: uv run --no-group full pytest tests/ -q
      - name: Evals
        run: uv run --no-group full python -m evals

  # Full install — exercises the CadQuery-backed geometry tests and the
  # opcut/rectpack/reportlab cutlist paths. Ubuntu + macOS are required
  # (macOS is the dev platform and its full stack is proven locally).
  full:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: System deps (cairo headers — opcut pulls pycairo, which builds from sdist)
        # Linux/macOS need the cairo C library + pkg-config to build pycairo.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cairo pkg-config
          fi
      - name: Install (full)
        run: uv sync
      - name: Tests
        run: uv run pytest tests/ -q
      - name: Evals
        run: uv run python -m evals

  # Windows full is the risky one: opcut's pycairo dependency and CadQuery's
  # OCP wheels are least battle-tested there. Kept INFORMATIONAL for now
  # (continue-on-error) so a native-build hiccup surfaces without blocking
  # merges. Promote into the `full` matrix once it's reliably green.
  full-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (full)
        # pycairo ships Windows wheels on PyPI (no system cairo needed); if
        # opcut's pin ever forces an sdist build this job will fail — which
        # is exactly the signal continue-on-error is here to surface.
        run: uv sync
      - name: Tests
        run: uv run pytest tests/ -q
      - name: Evals
        run: uv run python -m evals
